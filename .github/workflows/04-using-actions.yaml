name: 04 - Using Actions

on:
    workflow_dispatch

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: C:\Users\Bimsara Dharana\OneDrive\Documents\GH-ACTIONS-COURSE\04-using-actions\react-app
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                  node-version: 20

            - name: Install dependencies
              run: npm ci

            - name: Run unit tests
              run: npm run test
     #    checkout code from the repository
     #    install dependancies of react application
     #    execute automated tests
